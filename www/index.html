<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06090d"><title>IRONBOX — WOD Engine</title><style>:root{font-family:system-ui;color:#eaf2f8;background:#06090d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2637,#06090d 75%);min-height:100vh}header{padding:18px;border-bottom:2px solid #ff2e3c;font-size:23px;font-weight:900;letter-spacing:3px}main{max-width:680px;margin:auto;padding:16px}nav{display:flex;gap:6px;overflow:auto;margin-bottom:15px}button{border:1px solid #32445a;background:#172330;color:white;border-radius:12px;padding:12px;cursor:pointer;font-weight:700}nav button{flex:1;white-space:nowrap;font-size:12px}button.active{background:linear-gradient(135deg,#ff2e3c,#ff7a18);border:0;color:#08090d}.card{background:#111d29;border:1px solid #26384a;border-radius:20px;padding:18px;margin-bottom:14px}.label{text-align:center;color:#ffb020;font-weight:800;letter-spacing:3px}.clock{text-align:center;font-size:clamp(65px,18vw,115px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}.sub{text-align:center;color:#8ca1b4;margin-bottom:14px}.actions{display:flex;gap:8px}.actions button{flex:1;font-size:17px}.start{background:linear-gradient(135deg,#2bd97c,#c8f531);color:#06210f}.pause{background:#ffb020;color:#17110a}label{display:block;margin:14px 0;color:#c0d0de;font-size:14px}input{display:block;width:100%;background:#09121b;border:1px solid #32445a;border-radius:10px;color:white;padding:10px;margin-top:5px;font-size:17px}h2{font-size:17px;letter-spacing:2px}small{color:#8ca1b4}#round{color:#c8f531;text-align:center;font-weight:800;font-size:20px}#history article{padding:12px;border-bottom:1px solid #26384a}footer{text-align:center;color:#6a8095;padding:20px}</style></head><body><header>🏋 IRONBOX <small>WOD ENGINE</small></header><main><nav id="modes"></nav><section class="card"><div class="label" id="phase">ГОТОВ</div><div class="clock" id="clock">00:20</div><div class="sub" id="subtitle">Настрой и нажми старт</div><div id="round"></div><div class="actions"><button id="reset">СБРОС</button><button id="start" class="start">СТАРТ</button><button id="skip">ДАЛЬШЕ</button></div></section><section class="card"><h2>ПАРАМЕТРЫ</h2><div id="config"></div></section><section class="card"><h2>КОМПЛЕКСЫ</h2><div id="wods"></div></section><section class="card"><h2>ИСТОРИЯ</h2><div id="history"></div></section><footer>IRONBOX · Офлайн-таймер</footer></main><script>
const $=s=>document.querySelector(s),modes={tabata:'TABATA',amrap:'AMRAP',emom:'EMOM',fortime:'FOR TIME',intervals:'ИНТЕРВАЛЫ'},defaults={tabata:{work:20,rest:10,rounds:8,prep:10},amrap:{duration:1200,prep:10},emom:{interval:60,rounds:16,prep:10},fortime:{duration:1200,prep:10},intervals:{work:60,rest:30,rounds:5,prep:10}};let cfg=JSON.parse(localStorage.getItem('ib.cfg')||'null')||defaults,mode='tabata',parts=[],index=0,left=0,running=false,last=0,elapsed=0,rounds=0,history=JSON.parse(localStorage.getItem('ib.hist')||'[]');const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};function persist(){localStorage.setItem('ib.cfg',JSON.stringify(cfg))}function make(){let c=cfg[mode],p=[];if(c.prep)p.push({type:'prep',time:c.prep,title:'ПОДГОТОВКА'});if(mode==='tabata'){for(let i=0;i<c.rounds;i++){p.push({type:'work',time:c.work,title:'РАБОТА',round:i+1});if(i<c.rounds-1&&c.rest)p.push({type:'rest',time:c.rest,title:'ОТДЫХ'})}}else if(mode==='emom'){for(let i=0;i<c.rounds;i++)p.push({type:'work',time:c.interval,title:'EMOM',round:i+1})}else if(mode==='intervals'){for(let i=0;i<c.rounds;i++){p.push({type:'work',time:c.work,title:'РАБОТА',round:i+1});if(i<c.rounds-1&&c.rest)p.push({type:'rest',time:c.rest,title:'ОТДЫХ'})}}else p.push({type:'work',time:c.duration,title:modes[mode]});parts=p;index=0;left=p[0].time;elapsed=0;rounds=0;draw()}function draw(){let p=parts[index];$('#phase').textContent=running?p.title:(elapsed?'ПАУЗА':'ГОТОВ');$('#phase').style.color=p.type==='rest'?'#22d3ee':p.type==='prep'?'#ffb020':'#ff2e3c';let value=mode==='fortime'&&p.type==='work'?p.time-left:left;$('#clock').textContent=fmt(value);$('#subtitle').textContent=mode==='amrap'?'Раундов: '+rounds:mode==='fortime'?'Прошло времени':'Следуй сигналам';$('#round').textContent=p.round?'Раунд '+p.round:'';$('#start').textContent=running?'ПАУЗА':elapsed?'ПРОДОЛЖИТЬ':'СТАРТ';$('#start').className=running?'pause':'start'}let audio;function beep(freq=780){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch(e){}}function next(){index++;if(index>=parts.length){running=false;beep(1100);history.unshift({mode:modes[mode],date:new Date().toLocaleString('ru-RU'),time:Math.round(elapsed),rounds});localStorage.setItem('ib.hist',JSON.stringify(history));renderHistory();make();$('#phase').textContent='ГОТОВО!';return}left=parts[index].time;beep(parts[index].type==='rest'?450:950)}function tick(t){if(running){let d=Math.min(5,(t-last)/1000);left-=d;elapsed+=d;while(left<=0&&running){let over=-left;next();left-=over}draw()}last=t;requestAnimationFrame(tick)}function renderConfig(){let c=cfg[mode];$('#config').innerHTML=Object.entries(c).map(([k,v])=>'<label>'+({work:'Работа (сек)',rest:'Отдых (сек)',rounds:'Раунды',prep:'Подготовка (сек)',duration:'Длительность (сек)',interval:'Интервал (сек)'}[k]||k)+'<input type="number" min="0" max="7200" data-key="'+k+'" value="'+v+'"></label>').join('');$('#config').querySelectorAll('input').forEach(e=>e.onchange=()=>{c[e.dataset.key]=Math.max(0,Math.min(7200,Number(e.value)||0));persist();running=false;make()})}function select(m){running=false;mode=m;$('#modes').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));renderConfig();make()}$('#modes').innerHTML=Object.entries(modes).map(([k,v])=>'<button data-mode="'+k+'">'+v+'</button>').join('');$('#modes').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.mode));$('#start').onclick=()=>{running=!running;beep();draw()};$('#reset').onclick=()=>{running=false;make()};$('#skip').onclick=()=>{next();draw()};$('#wods').innerHTML=[['FRAN','fortime',480],['CINDY','amrap',1200],['MURPH','fortime',3600],['HELEN','fortime',900],['GRACE','fortime',420],['TABATA 20/10','tabata',0]].map(([n,m,d])=>'<button style="margin:4px" data-m="'+m+'" data-d="'+d+'">'+n+'</button>').join('');$('#wods').querySelectorAll('button').forEach(b=>b.onclick=()=>{let m=b.dataset.m;select(m);if(+b.dataset.d)cfg[m].duration=+b.dataset.d;renderConfig();make()});function renderHistory(){$('#history').innerHTML=history.length?history.slice(0,30).map(h=>'<article>'+h.mode+' · '+h.date+' · '+fmt(h.time)+(h.rounds?' · '+h.rounds+' раундов':'')+'</article>').join(''):'<small>Пока нет завершённых тренировок</small>'}select('tabata');renderHistory();requestAnimationFrame(tick);
</script></body></html>
